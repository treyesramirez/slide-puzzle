<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo Oscuro del Favicon -->
  <rect width="512" height="512" rx="112" fill="#0f1423"/>

  <!-- Ficha Azul con Esquinas Redondeadas -->
